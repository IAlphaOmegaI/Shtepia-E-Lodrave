services:
  shlo-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.shtepialodrave.com/api}
        NEXT_PUBLIC_SHOP_ID: ${NEXT_PUBLIC_SHOP_ID:-18}
        NEXT_PUBLIC_VENDOR_ID: ${NEXT_PUBLIC_VENDOR_ID:-3838}
        NEXT_PUBLIC_IMAGE_URL: ${NEXT_PUBLIC_IMAGE_URL:-https://api.shtepialodrave.com}
    container_name: shlo-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.shtepialodrave.com/api}
      - NEXT_PUBLIC_SHOP_ID=${NEXT_PUBLIC_SHOP_ID:-18}
      - NEXT_PUBLIC_VENDOR_ID=${NEXT_PUBLIC_VENDOR_ID:-3838}
      - NEXT_PUBLIC_IMAGE_URL=${NEXT_PUBLIC_IMAGE_URL:-https://api.shtepialodrave.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
